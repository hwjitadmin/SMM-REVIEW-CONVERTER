name: Cloud Run Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cloud Run へのデプロイは FIREBASE_TOKEN ではできないため、サービスアカウントの鍵で認証する
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Dockerfile から Cloud Build でイメージを作り、既存の Artifact Registry（cloud-run-repo、東京）に保存する
      # （gcloud run deploy --source は保管場所が cloud-run-source-deploy 固定で、その作成権限が無いため使わない）
      # ビルドのログを流すにはプロジェクトの閲覧者権限が必要なため流さない（完了は待つ）。
      # ログは Google Cloud コンソールの Cloud Build →「履歴」で確認する。
      - name: Build image
        run: |
          gcloud builds submit . \
            --project technology-section-app \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --timeout 1800s \
            --suppress-logs \
            --quiet
        env:
          IMAGE: asia-northeast1-docker.pkg.dev/technology-section-app/cloud-run-repo/smm-review-converter

      # 作ったイメージを Cloud Run（東京）にデプロイする
      # - concurrency 1：1台で同時に1件だけ変換（LibreOffice のメモリ使用量が大きいため）
      # - min-instances 0：使っていない間は停止して費用をかけない（初回は起動待ちあり）
      # - max-instances 3：想定外の大量アクセスで費用が膨らまないようにする上限
      # - allow-unauthenticated：画面（ブラウザ）から直接呼ぶために必要（呼び出し元は main.py の CORS で制限）
      - name: Deploy to Cloud Run
        env:
          IMAGE: asia-northeast1-docker.pkg.dev/technology-section-app/cloud-run-repo/smm-review-converter
        run: |
          gcloud run deploy smm-review-converter \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --project technology-section-app \
            --region asia-northeast1 \
            --allow-unauthenticated \
            --cpu 2 \
            --memory 2Gi \
            --concurrency 1 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 120 \
            --quiet

      # ✅ 成功時メール
      - name: Send Email on Success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: '【成功】SMM 案件審査ツール PDF変換サーバーのデプロイが完了しました'
          body: |
            お疲れ様です。

            SMM 案件審査ツールの PDF 変換サーバー（Cloud Run）のデプロイが成功しました。

            【デプロイ情報】
            • デプロイ日時: ${{ github.event.head_commit.timestamp }}
            • コミット ID: ${{ github.sha }}
            • ブランチ: ${{ github.ref }}
            • 実行者: ${{ github.actor }}

            https://smm-review-tool.web.app の「審査書類一式ファイル出力」で動作確認をお願いいたします。

            よろしくお願いいたします。
          to: aryal.b@qcells.com
          from: ${{ secrets.EMAIL_USERNAME }}

      # ❌ 失敗時メール
      - name: Send Email on Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: '【失敗】SMM 案件審査ツール PDF変換サーバーのデプロイに失敗しました'
          body: |
            お疲れ様です。

            SMM 案件審査ツールの PDF 変換サーバー（Cloud Run）のデプロイが失敗いたしました。

            【失敗情報】
            • デプロイ日時: ${{ github.event.head_commit.timestamp }}
            • コミット ID: ${{ github.sha }}
            • ブランチ: ${{ github.ref }}
            • 実行者: ${{ github.actor }}

            GitHub Actions のログを確認いただき、原因の特定と修正をお願いいたします。
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            よろしくお願いいたします。
          to: aryal.b@qcells.com
          from: ${{ secrets.EMAIL_USERNAME }}
