name: Cloud Run Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cloud Run へのデプロイは FIREBASE_TOKEN ではできないため、サービスアカウントの鍵で認証する
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Dockerfile から Cloud Build でイメージを作り、Cloud Run（東京）にデプロイする
      # - concurrency 1：1台で同時に1件だけ変換（LibreOffice のメモリ使用量が大きいため）
      # - min-instances 0：使っていない間は停止して費用をかけない（初回は起動待ちあり）
      # - max-instances 3：想定外の大量アクセスで費用が膨らまないようにする上限
      # - allow-unauthenticated：Firebase Hosting の rewrite から呼ぶために必要
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy smm-review-converter \
            --source . \
            --project hanwha-japan-app \
            --region asia-northeast1 \
            --allow-unauthenticated \
            --cpu 2 \
            --memory 2Gi \
            --concurrency 1 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 120 \
            --quiet

      # ✅ 成功時メール
      - name: Send Email on Success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: '【成功】SMM 案件審査ツール PDF変換サーバーのデプロイが完了しました'
          body: |
            お疲れ様です。

            SMM 案件審査ツールの PDF 変換サーバー（Cloud Run）のデプロイが成功しました。

            【デプロイ情報】
            • デプロイ日時: ${{ github.event.head_commit.timestamp }}
            • コミット ID: ${{ github.sha }}
            • ブランチ: ${{ github.ref }}
            • 実行者: ${{ github.actor }}

            https://smm-review-tool.web.app の「審査書類一式ファイル出力」で動作確認をお願いいたします。

            よろしくお願いいたします。
          to: aryal.b@qcells.com
          from: ${{ secrets.EMAIL_USERNAME }}

      # ❌ 失敗時メール
      - name: Send Email on Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: '【失敗】SMM 案件審査ツール PDF変換サーバーのデプロイに失敗しました'
          body: |
            お疲れ様です。

            SMM 案件審査ツールの PDF 変換サーバー（Cloud Run）のデプロイが失敗いたしました。

            【失敗情報】
            • デプロイ日時: ${{ github.event.head_commit.timestamp }}
            • コミット ID: ${{ github.sha }}
            • ブランチ: ${{ github.ref }}
            • 実行者: ${{ github.actor }}

            GitHub Actions のログを確認いただき、原因の特定と修正をお願いいたします。
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            よろしくお願いいたします。
          to: aryal.b@qcells.com
          from: ${{ secrets.EMAIL_USERNAME }}
