<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Excel でよく使われる Windows の日本語フォントを、ライセンス上サーバーに置ける代替フォントに対応付ける -->
<fontconfig>
  <alias binding="same"><family>ＭＳ ゴシック</family><accept><family>IPAGothic</family></accept></alias>
  <alias binding="same"><family>MS Gothic</family><accept><family>IPAGothic</family></accept></alias>
  <alias binding="same"><family>ＭＳ Ｐゴシック</family><accept><family>IPAPGothic</family></accept></alias>
  <alias binding="same"><family>MS PGothic</family><accept><family>IPAPGothic</family></accept></alias>
  <alias binding="same"><family>ＭＳ 明朝</family><accept><family>IPAMincho</family></accept></alias>
  <alias binding="same"><family>MS Mincho</family><accept><family>IPAMincho</family></accept></alias>
  <alias binding="same"><family>ＭＳ Ｐ明朝</family><accept><family>IPAPMincho</family></accept></alias>
  <alias binding="same"><family>MS PMincho</family><accept><family>IPAPMincho</family></accept></alias>
  <alias binding="same"><family>メイリオ</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Meiryo</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Meiryo UI</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>游ゴシック</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Yu Gothic</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>游明朝</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>Yu Mincho</family><accept><family>Noto Serif CJK JP</family></accept></alias>
</fontconfig>
